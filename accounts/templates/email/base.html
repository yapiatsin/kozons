<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site_name }}</title>
</head>
<body style="margin:0;padding:0;background:{{ color_bg }};font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:{{ color_bg }};padding:32px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:{{ color_card }};border-radius:16px;overflow:hidden;">
          <tr>
            <td style="background:{{ color_primary }};padding:28px 32px;" align="center">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  {% if has_logo %}
                  <td style="width:48px;height:48px;"><img src="{{ logo_src }}" width="48" height="48" alt="{{ site_name }}" style="display:block;border:0;border-radius:12px;"></td>
                  {% else %}
                  <td style="width:48px;height:48px;background:#ffffff;border-radius:12px;text-align:center;vertical-align:middle;font-size:26px;font-weight:800;color:{{ color_primary }};">K</td>
                  {% endif %}
                  <td style="padding-left:12px;font-size:26px;font-weight:700;color:#ffffff;">{{ site_name }}</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;color:{{ color_text }};font-size:15px;line-height:1.6;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:18px 32px 26px;border-top:1px solid #e9edef;color:{{ color_muted }};font-size:12px;line-height:1.5;" align="center">
              {{ site_tagline }}<br>
              Cet e-mail a été envoyé automatiquement, merci de ne pas y répondre.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
