# Pile de production Kozons — déployée dans /opt/kozons sur le VPS (voir Makefile).
#
# Troisième projet du VPS : le Caddy (eprinters_caddy) est partagé avec eprinters
# et autopiece. Il n'est donc pas lancé ici ; il joint kozons-web par son nom sur
# le réseau `web` et sert /static et /media depuis /srv/apps/kozons.
# Le fichier de site se trouve dans caddy/kozons.caddy.
#
# Noms préfixés `kozons-` : sur le réseau partagé, un service nommé `web` entrerait
# en collision avec celui d'eprinters.

services:
  kozons-web:
    build: .
    image: kozons-web:latest
    container_name: kozons-web
    restart: unless-stopped
    depends_on:
      kozons-db:
        condition: service_healthy
      kozons-redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Valeurs imposées en production, quel que soit le contenu de .env.
      DB_ENGINE: postgresql
      DB_HOST: kozons-db
      DB_PORT: "5432"
      KOZONS_REDIS_URL: redis://kozons-redis:6379/0
      # Appels WebRTC : relais kozons-turn, identifiants temporaires signés avec TURN_SECRET.
      KOZONS_TURN_URL: turn:kozonstic.com:3478?transport=udp,turn:kozonstic.com:3478?transport=tcp
      KOZONS_TURN_SECRET: ${TURN_SECRET:?TURN_SECRET manquant dans .env}
    volumes:
      # Uploads et statiques : dossiers lus directement par Caddy.
      - /srv/apps/kozons/media:/app/media
      - /srv/apps/kozons/static:/app/staticfiles
    ports:
      # Accès local uniquement (sonde, dépannage). autopiece utilise déjà 8010.
      - "127.0.0.1:8020:8000"
    networks:
      - kozons
      - caddy

  kozons-db:
    image: postgres:16-alpine
    container_name: kozons-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-kozons}
      POSTGRES_USER: ${DB_USER:-kozons}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      # Données PostgreSQL : volume Docker, survit aux rebuilds et à `make down`.
      - pgdata:/var/lib/postgresql/data
      # Dépôt des sauvegardes (make backup / make restore).
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kozons} -d ${DB_NAME:-kozons}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - kozons

  kozons-redis:
    image: redis:7-alpine
    container_name: kozons-redis
    restart: unless-stopped
    # Sert uniquement de channel layer (messages temps réel) : aucune persistance utile.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - kozons

  # Serveur TURN : relaie l'audio/vidéo quand la connexion directe entre deux
  # appareils est impossible (4G, réseaux d'entreprise…).
  # Réseau de l'hôte : une plage de ports UDP publiée par Docker serait très lente.
  # Ports à ouvrir dans UFW : `make firewall`.
  kozons-turn:
    image: coturn/coturn:4.6-alpine
    container_name: kozons-turn
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --realm=kozonstic.com
      - --listening-port=3478
      - --listening-ip=${TURN_EXTERNAL_IP:?TURN_EXTERNAL_IP manquant dans .env}
      - --relay-ip=${TURN_EXTERNAL_IP}
      - --external-ip=${TURN_EXTERNAL_IP}
      - --min-port=49160
      - --max-port=49260
      # Identifiants temporaires générés par Django (chat/views.py → ice_servers).
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --fingerprint
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-tcp-relay
      - --no-multicast-peers
      - --no-software-attribute
      - --stale-nonce=600
      - --user-quota=12
      - --total-quota=200
      # Interdit de relayer vers les réseaux internes (conteneurs Docker, localhost…).
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255

volumes:
  pgdata:

networks:
  # Réseau privé : seul kozons-web joint PostgreSQL et Redis.
  kozons:
    driver: bridge
  # Réseau du Caddy partagé, déjà créé sur le VPS.
  caddy:
    external: true
    name: web
