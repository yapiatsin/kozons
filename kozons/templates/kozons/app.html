{% load static %}<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0099cc">
  <title>Kozons</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="{% static 'kozons/icon.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ css_url }}">
  <script type="importmap">{{ import_map|safe }}</script>
  <script>
    // Thème appliqué avant le rendu pour éviter le flash.
    (function () {
      try { var t = JSON.parse(localStorage.getItem('kozons.theme')); if (t && t !== 'system') document.documentElement.dataset.theme = t; } catch (e) {}
    })();
  </script>
</head>
<body data-idle-minutes="{{ idle_logout_minutes }}">
  <div id="app"><div class="boot"><div class="boot-logo"></div></div></div>
  <div id="overlay-root"></div>
  <div id="toast-root"></div>
  <script type="module" src="{{ app_js_url }}"></script>
</body>
</html>
